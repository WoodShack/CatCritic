<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Edit ' + ${cat.name} + ' - CatCritic'">Edit Cat - CatCritic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav th:replace="~{fragment/navbar :: navbar}"></nav>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card-panel">

                <h2 class="fw-bold text-center mb-1">✏️ Edit <span th:text="${cat.name}">Cat</span></h2>
                <p class="text-center text-muted mb-4">Update the details below.</p>

                <div class="alert alert-danger"
                     th:if="${uploadError}"
                     th:text="${uploadError}"></div>

                <form th:action="@{/cats/{id}/edit(id=${cat.id})}" th:object="${cat}"
                      method="POST" enctype="multipart/form-data" novalidate>

                    <div class="alert alert-danger"
                         th:if="${#fields.hasGlobalErrors()}">
                        <div th:each="err : ${#fields.globalErrors()}"
                             th:text="${err}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Cat's Name</label>
                        <input type="text" id="name" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               class="form-control">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="age" class="form-label">Age (years)</label>
                        <input type="number" id="age" th:field="*{age}"
                               th:classappend="${#fields.hasErrors('age')} ? 'is-invalid'"
                               class="form-control"
                               min="0" max="30">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('age')}"
                             th:errors="*{age}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="breed" class="form-label">Breed</label>
                        <select id="breed" th:field="*{breed}"
                                th:classappend="${#fields.hasErrors('breed')} ? 'is-invalid'"
                                class="form-select">
                            <option th:each="b : ${breeds}"
                                    th:value="${b}"
                                    th:text="${b.label}"></option>
                        </select>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('breed')}"
                             th:errors="*{breed}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" th:field="*{description}"
                                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                  class="form-control" rows="4"></textarea>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('description')}"
                             th:errors="*{description}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="photo" class="form-label">Replace Photo (optional)</label>
                        <input type="file" id="photo" name="photo"
                               accept="image/*" class="form-control">
                        <div class="form-text">Leave blank to keep the current photo.</div>
                        <img th:if="${cat.imageUrl}" th:src="${cat.imageUrl}" th:alt="${cat.name}"
                             class="mt-2 rounded" style="max-height: 150px;">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-amber flex-grow-1 py-2">
                            Save Changes
                        </button>
                        <a th:href="@{/cats/{id}(id=${cat.id})}" class="btn btn-outline-amber flex-grow-1 py-2">
                            Cancel
                        </a>
                    </div>

                </form>

                <form th:action="@{/cats/{id}/delete(id=${cat.id})}" method="POST" class="mt-3"
                      onsubmit="return confirm('Delete this cat listing? This cannot be undone.');">
                    <button type="submit" class="btn btn-outline-danger w-100">
                        🗑️ Delete This Cat
                    </button>
                </form>

            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
