<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - CatCritic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav th:replace="~{fragment/navbar :: navbar}"></nav>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card-panel text-center">
                <div class="fs-1 mb-3">🚫</div>
                <h2 class="fw-bold mb-2">Access Denied</h2>
                <p class="text-muted mb-4">
                    Your account doesn't have permission to do that. If you think this is a
                    mistake, contact an administrator.
                </p>
                <a th:href="@{/cats}" class="btn btn-amber px-4">Back to Browsing</a>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
