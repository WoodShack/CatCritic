<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CatCritic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragment/navbar :: navbar}"></nav>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-panel">
                <h2 class="fw-bold text-center mb-4">Log In</h2>

                <div class="alert alert-danger" th:if="${loginError}" th:text="${loginError}"></div>

                <form th:action="@{/login}" th:object="${loginForm}" method="POST" novalidate>

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" th:field="*{username}"
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                               class="form-control" placeholder="Your username">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                             th:errors="*{username}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" th:field="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                               class="form-control" placeholder="Your password">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}"></div>
                    </div>

                    <button type="submit" class="btn btn-pink w-100 py-2">Log In</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Need an account? <a th:href="@{/register}">Register here</a>
                </p>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
