<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Cat - CatCritic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav th:replace="~{fragment/navbar :: navbar}"></nav>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card-panel">

                <h2 class="fw-bold text-center mb-1">🐱 Submit Your Cat</h2>
                <p class="text-center text-muted mb-4">Share your furry friend with the world!</p>

                <div class="alert alert-danger"
                     th:if="${uploadError}"
                     th:text="${uploadError}"></div>

                <form th:action="@{/cats/new}" th:object="${cat}"
                      method="POST" enctype="multipart/form-data" novalidate>

                    <div class="alert alert-danger"
                         th:if="${#fields.hasGlobalErrors()}">
                        <div th:each="err : ${#fields.globalErrors()}"
                             th:text="${err}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Cat's Name</label>
                        <input type="text" id="name" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               class="form-control"
                               placeholder="e.g. Mittens">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="age" class="form-label">Age (years)</label>
                        <input type="number" id="age" th:field="*{age}"
                               th:classappend="${#fields.hasErrors('age')} ? 'is-invalid'"
                               class="form-control"
                               min="0" max="30" placeholder="e.g. 3">
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('age')}"
                             th:errors="*{age}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="breed" class="form-label">Breed</label>
                        <select id="breed" th:field="*{breed}"
                                th:classappend="${#fields.hasErrors('breed')} ? 'is-invalid'"
                                class="form-select">
                            <option value="">-- Select Breed --</option>
                            <option th:each="b : ${breeds}"
                                    th:value="${b}"
                                    th:text="${b.label}"></option>
                        </select>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('breed')}"
                             th:errors="*{breed}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" th:field="*{description}"
                                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                  class="form-control" rows="4"
                                  placeholder="Tell us about this cat's personality..."></textarea>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('description')}"
                             th:errors="*{description}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="photo" class="form-label">Photo</label>
                        <input type="file" id="photo" name="photo"
                               accept="image/*" class="form-control">
                        <div class="form-text">JPG, PNG, or GIF — max 5 MB</div>
                    </div>

                    <button type="submit" class="btn btn-amber w-100 py-2">
                        🐾 Submit Cat
                    </button>

                </form>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
