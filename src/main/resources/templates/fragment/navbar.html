<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">

        <a class="navbar-brand" th:href="@{/}">🐱 CatCritic</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/}"
                       th:classappend="${#strings.equals(requestURI, '/')} ? 'active'">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/cats}"
                       th:classappend="${requestURI != null and #strings.startsWith(requestURI, '/cats')} ? 'active'">
                        Browse Cats
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/cats/new}"
                       th:classappend="${requestURI != null and #strings.equals(requestURI, '/cats/new')} ? 'active'">
                        Submit a Cat
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link"
                       th:href="@{/admin}"
                       th:classappend="${requestURI != null and #strings.startsWith(requestURI, '/admin')} ? 'active'">
                        ⚙️ Admin
                    </a>
                </li>

                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">
                        Login
                    </a>
                </li>

                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/register}">
                        Register
                    </a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="nav-link fw-semibold">
                        👋 <span sec:authentication="name">user</span>

                        <span class="badge badge-amber ms-1"
                              sec:authorize="hasRole('ADMIN')">
                            Admin
                        </span>
                    </span>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="POST" class="d-inline">
                        <button type="submit"
                                class="btn btn-sm btn-outline-amber ms-lg-2">
                            Logout
                        </button>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>
