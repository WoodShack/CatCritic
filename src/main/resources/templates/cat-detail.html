<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${cat.name} + ' - CatCritic'">Cat - CatCritic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<nav th:replace="~{fragment/navbar :: navbar}"></nav>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div th:if="${justSubmitted}" class="alert alert-success text-center fw-bold">
                🎉 Your cat has been submitted successfully!
            </div>

            <div class="card-panel">
                <img th:src="${cat.imageUrl}"
                     th:alt="${cat.name}"
                     class="cat-photo rounded mb-3">

                <h2 class="fw-bold" th:text="${cat.name}">Mittens</h2>

                <p class="mb-1">
                    <span class="badge badge-amber me-2"
                          th:text="${cat.breed.label}">Breed</span>
                    <span class="text-muted"
                          th:text="${cat.age} + ' years old'">3 years old</span>
                </p>

                <p class="mb-3">
                    <span class="stars-display">
                        <span th:each="i : ${#numbers.sequence(1, 10)}"
                              th:text="${i <= cat.roundedRating} ? '★' : '☆'"></span>
                    </span>
                    <span class="text-muted small"
                          th:text="${cat.ratingCount == 0}
                            ? '(no ratings yet)'
                            : ('(' + ${#numbers.formatDecimal(cat.averageRating, 1, 1)} + '/10 from ' + ${cat.ratingCount} + ' ratings)')">
                        (no ratings yet)
                    </span>
                </p>

                <p class="mb-3" th:text="${cat.description}">Description</p>

                <p class="text-muted small mb-3"
                   th:if="${cat.ownerUsername != null}"
                   th:text="'🐾 Submitted by ' + ${cat.ownerUsername}">
                    🐾 Submitted by user
                </p>

                <hr class="my-3">

                <div th:if="${userRating != null}" class="text-center py-2">
                    <span class="badge badge-amber fs-6 px-3 py-2">
                        ⭐ You rated this cat <strong th:text="${userRating.stars}"></strong>/10
                    </span>
                </div>

               

                <div th:if="${loggedIn and userRating == null}">
                    <h6 class="fw-bold mb-2">Rate This Cat</h6>
                    <form th:action="@{/cats/{id}/rate(id=${cat.id})}" method="POST">
                        <div class="star-rating justify-content-center">
                            <th:block th:each="i : ${#numbers.sequence(10, 1, -1)}">
                                <input type="radio"
                                       th:id="'star-detail-' + ${i}"
                                       name="stars"
                                       th:value="${i}"/>
                                <label th:for="'star-detail-' + ${i}">★</label>
                            </th:block>
                        </div>
                        <button type="submit" class="btn btn-amber w-100 mt-3">
                            Submit Rating
                        </button>
                    </form>
                </div>

                <div th:if="${!loggedIn}" class="text-center mt-2">
                    <a th:href="@{/login}" class="btn btn-outline-amber btn-sm">
                        Log in to Rate
                    </a>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <a th:href="@{/cats}"
                       class="btn btn-amber flex-grow-1">Browse All Cats</a>
                    <a th:href="@{/cats/new}"
                       class="btn btn-outline-amber flex-grow-1">Submit Another</a>
                </div>

            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
